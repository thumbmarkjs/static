<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signal stability — iframe context</title>
    <style>
        /* Deliberately minimal, like experimental-iframe2.html: the point of
           this frame is to be a DIFFERENT realm, not a differently-styled one.
           Any layout or font styling here would perturb the very signals the
           parent is trying to compare, so keep this block boring. */
        body { font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 12px; color: #333; }
        #status { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
    </style>
</head>
<body>
    <div id="status">iframe: starting…</div>

    <script>
    (async function () {
        var status = document.getElementById('status');
        var params = new URLSearchParams(location.search);
        var artifactUrl = params.get('artifact');

        function report(payload) {
            // The parent is same-origin, but target the exact origin anyway
            // rather than '*' -- there is no reason to broadcast a
            // fingerprint payload to whoever happens to be listening.
            try {
                parent.postMessage(Object.assign({ source: 'thumbmark-signal-iframe' }, payload), location.origin);
            } catch (err) {
                status.textContent = 'iframe: could not post to parent — ' + err.message;
            }
        }

        if (!artifactUrl) {
            status.textContent = 'iframe: no ?artifact= given';
            report({ error: 'no artifact url' });
            return;
        }

        try {
            var response = await fetch(artifactUrl, { method: 'GET' });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            var text = await response.text();

            // Same timing hook the parent uses -- an array pre-installed on
            // globalThis makes the shipped runner push
            // [name, syncMs, settleMs, status] per signal.
            var timings = [];
            globalThis.__thumbmarkSignalTimings = timings;

            var started = performance.now();
            var envelope = await Promise.resolve(eval(text));
            var elapsedMs = performance.now() - started;

            status.textContent = 'iframe: ' + Object.keys(envelope.signals || {}).length +
                ' signals in ' + elapsedMs.toFixed(1) + 'ms — sent to parent';
            report({ envelope: envelope, timings: timings, elapsedMs: elapsedMs });
        } catch (err) {
            status.textContent = 'iframe: failed — ' + err.message;
            report({ error: err.message });
        }
    })();
    </script>
</body>
</html>
